<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Code2Config Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { background: #1e1e1e; border: 1px solid #333; }
        body { background: #121212; color: #e0e0e0; }
    </style>
</head>
<body class="p-8">
    <div id="app" class="max-w-4xl mx-auto">
        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-blue-400">Code2Config Controller</h1>
            <p class="text-gray-400">Restart program to check your modification</p>
        </header>

        <div v-for="map in data.maps" :key="map.project_profile.identifier">
            <div v-for="entity in map.logic_entities" :key="entity.entity_path" class="mb-10">
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <span class="px-2 py-1 rounded text-xs mr-2" 
                          :class="entity.role_tag === 'Core' ? 'bg-red-900 text-red-200' : 'bg-green-900 text-green-200'">
                        {{ entity.role_tag }}
                    </span>
                    {{ entity.entity_path.split('/').pop() }}
                </h2>

                <div class="grid grid-cols-1 gap-4">
                    <div v-for="node in entity.tunable_nodes" :key="node.var_id" class="card p-4 rounded-lg shadow-lg">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <label class="block font-medium text-blue-300">{{ node.semantic_label }}</label>
                                <p class="text-xs text-gray-500 italic">{{ node.var_id }}</p>
                            </div>
                            <span class="text-xs font-mono bg-gray-800 px-2 py-1 rounded">{{ data.settings[node.var_id] }}</span>
                        </div>
                        
                        <p class="text-sm text-gray-400 mb-4">{{ node.functional_impact }}</p>

                        <div v-if="node.constraints.type === 'range'">
                            <div class="flex items-center space-x-4">
                                <input type="range" class="flex-grow h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                    :min="node.constraints.values[0]" 
                                    :max="node.constraints.values[1]" 
                                    :step="node.data_type === 'int' ? 1 : 0.01"
                                    v-model.number="data.settings[node.var_id]" 
                                    @input="updateValue(node.var_id, data.settings[node.var_id])">
                                
                                <input type="number" class="w-20 bg-gray-800 border border-gray-600 text-blue-300 text-right px-2 py-1 rounded-md text-sm font-mono focus:border-blue-500 outline-none"
                                    :min="node.constraints.values[0]" 
                                    :max="node.constraints.values[1]" 
                                    :step="node.data_type === 'int' ? 1 : 0.1"
                                    v-model.number="data.settings[node.var_id]" 
                                    @change="updateValue(node.var_id, data.settings[node.var_id])">
                            </div>
                        </div>

                        <div v-else-if="node.constraints.type === 'options'">
                            <select class="bg-gray-800 border border-gray-600 text-sm rounded-lg block w-full p-2.5"
                                    v-model="data.settings[node.var_id]" @change="updateValue(node.var_id, data.settings[node.var_id])">
                                <option v-for="opt in node.constraints.values" :key="opt" :value="opt">{{ opt }}</option>
                            </select>
                        </div>

                        <div v-else-if="node.data_type === 'bool'">
                            <button @click="toggleBool(node.var_id)" 
                                    :class="data.settings[node.var_id] ? 'bg-blue-600' : 'bg-gray-600'"
                                    class="px-4 py-1 rounded text-sm font-bold transition-colors">
                                {{ data.settings[node.var_id] ? 'ON' : 'OFF' }}
                            </button>
                        </div>

                        <div v-else>
                            <div class="relative">
                                <input type="text" 
                                    class="w-full bg-gray-800 border border-gray-600 text-gray-200 px-3 py-2 rounded-lg text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all"
                                    v-model="data.settings[node.var_id]"
                                    @change="updateValue(node.var_id, data.settings[node.var_id])"
                                    placeholder="Enter text value...">
                                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                    <svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: { data: { maps: [], settings: {} } },
            mounted() { this.fetchData(); },
            methods: {
                fetchData() {
                    fetch('/api/data').then(r => r.json()).then(d => { this.data = d; });
                },
                updateValue(id, val) {
                    fetch('/api/update', {
                        method: 'POST',
                        body: JSON.stringify({ var_id: id, value: isNaN(val) ? val : Number(val) })
                    });
                },
                toggleBool(id) {
                    this.data.settings[id] = !this.data.settings[id];
                    this.updateValue(id, this.data.settings[id]);
                }
            }
        });
    </script>
</body>
</html>
